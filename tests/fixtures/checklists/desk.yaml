name: pack_the_desk
description: End-of-day tidy-up. Used by tests and the demo.
expected_objects:
  - laptop
  - charger
  - coffee_mug
  - pen
  - tray
aliases:
  laptop: [macbook, notebook computer]
  charger: [power brick, power adapter]
  coffee_mug: [cup, mug, coffee cup]
  pen: [ballpoint, biro]
steps:
  - step_id: unplug_charger
    description: Unplug the charger from the laptop
  - step_id: close_laptop
    description: Close the laptop lid
  - step_id: mug_to_tray
    description: Move the mug onto the tray
  - step_id: stow_pen
    description: Put the pen away
