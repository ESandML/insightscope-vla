[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "insightscope-vla"
version = "0.0.0"
description = "Edge-first audit of what a camera saw versus what a person said."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edward Sanderson" }]
keywords = ["multimodal", "langgraph", "computer-vision", "audit", "edge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "langgraph>=1.0",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local model calls (Phase 2). Core install stays usable without them.
llm = ["instructor>=1.4", "openai>=1.40", "tenacity>=8.5"]
# Speech-to-text for clips without a transcript (Phase 2).
asr = ["faster-whisper>=1.0"]
# Browser demo (Phase 3).
ui = ["gradio>=5.0"]

[dependency-groups]
dev = [
  "import-linter>=2.0",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/insightscope"]

# --- Ruff: linting and formatting ----------------------------------------
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["insightscope"]

# --- mypy: static types ---------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
pretty = true

# --- pytest: test discovery and markers -----------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
  "unit: fast, no network, no files on disk",
  "graph: full graph run with fake clients",
  "contract: schema and model-output contract checks",
  "live: needs a running local model server",
  "eval: LLM-as-judge, non-deterministic",
]

# --- Coverage -------------------------------------------------------------
[tool.coverage.run]
source = ["insightscope"]
branch = true

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]
